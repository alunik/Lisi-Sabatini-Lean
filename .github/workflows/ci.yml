name: Lean build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          use-mathlib-cache: true
          leanchecker: true
          nanoda: false
      - name: Compile the solvable proof endpoint with warnings as errors
        run: lake env lean -DwarningAsError=true LisiSabatini/SolvableThreeSylowSynchronization.lean
      - name: Audit the endpoint axioms
        run: lake env lean -DwarningAsError=true LisiSabatini/SolvableThreeSylowSynchronizationAxiomAudit.lean
