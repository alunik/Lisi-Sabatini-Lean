name: Lean build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          build-args: >-
            --wfail
            +LisiSabatini:olean
            +LisiSabatini.HallBergerClassificationAssemblyAxiomAudit:olean
            +LisiSabatini.SolvableThreeSylowSynchronizationAxiomAudit:olean
          use-mathlib-cache: true
          leanchecker: true
          nanoda: false
